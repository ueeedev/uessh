# Builds and publishes a release whenever main carries a version (from
# pubspec.yaml) that has no release yet: bumping `version:` and pushing is
# all it takes. Also runnable by hand from the Actions tab (e.g. to retry a
# failed build of the current version).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release and its tag

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Is there a release for this version yet?
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$version: building a release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS build
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Test
        run: flutter test

      - name: Build DMG
        run: |
          tool/build_macos_dmg.sh
          mv "dist/uessh-${{ needs.version.outputs.version }}.dmg" \
             "dist/uessh-${{ needs.version.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows build
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build
        run: flutter build windows --release

      - name: Package (installer + portable zip)
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $release = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force dist | Out-Null

          Compress-Archive -Path "$release\*" `
            -DestinationPath "dist\uessh-$version-windows-x64-portable.zip"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" `
            "/DSourceDir=$PWD\$release" `
            "/DOutputDir=$PWD\dist" `
            windows\packaging\uessh.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: uessh ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Downloads
            - **macOS** (Apple Silicon and Intel): `uessh-${{ needs.version.outputs.version }}-macos.dmg`
            - **Windows** installer: `uessh-${{ needs.version.outputs.version }}-windows-x64-setup.exe`
            - **Windows** portable: `uessh-${{ needs.version.outputs.version }}-windows-x64-portable.zip`

            The builds aren't code-signed yet: on macOS, the first time,
            allow it in System Settings → Privacy & Security; on Windows,
            choose "More info → Run anyway" in SmartScreen.
